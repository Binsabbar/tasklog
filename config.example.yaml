# Tasklog Configuration Example
# Copy this file to ~/.tasklog/config.yaml and fill in your credentials

# Required: Jira configuration
jira:
  url: "https://your-domain.atlassian.net"
  username: "your-email@example.com"
  api_token: "your-jira-api-token"
  project_key: "PROJ"  # Project key to filter tasks
  # Optional: Task statuses to include when fetching tasks (defaults to ["In Progress"])
  task_statuses:
    - "In Progress"
    - "In Review"
  
  # Optional: Define shortcuts for quick time logging
  # Use these with: tasklog log daily
  # NOTE: Description/comment is required for all time logs (can be predefined in shortcut)
  shortcuts:
    - name: "daily"
      task: "PROJ-123"
      time: "30m"
      comment: "Daily standup meeting"
    
    - name: "standup"
      task: "PROJ-123"
      time: "15m"
      comment: "Team standup"
    
    - name: "code-review"
      task: "PROJ-456"
      # time not specified - will prompt user
      # comment not specified - will prompt user

# Optional: Tempo configuration (only needed if logging separately to Tempo)
# If your Jira uses Tempo for worklog tracking, leave this disabled
# Worklogs will be automatically tracked in Tempo through Jira
tempo:
  enabled: false  # Set to true only if you need separate Tempo logging
  api_token: ""   # Only required if enabled is true

# Optional: Database path (defaults to ~/.tasklog/tasklog.db)
database:
  path: ""

# Optional: Slack integration for break notifications
slack:
  user_token: "xoxp-your-slack-user-token"  # User OAuth Token (not Bot Token)
  channel_id: "C1234567890"  # Channel ID for break messages
  
  # Optional: Define break types for quick break registration
  breaks:
    - name: "lunch"
      duration: 60
      emoji: ":fork_and_knife:"
    
    - name: "prayer"
      duration: 15
      emoji: ":pray:"
    
    - name: "coffee"
      duration: 10
      emoji: ":coffee:"

